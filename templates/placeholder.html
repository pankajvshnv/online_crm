{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
            <h4 class="mb-sm-0">{{ page_title }}</h4>
            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="breadcrumb-item active">{{ page_title }}</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card text-center py-5">
            <div class="card-body">
                <div class="mb-4">
                    <i class="mdi mdi-tools text-primary display-4"></i>
                </div>
                <h3 class="fw-semibold">Coming Soon</h3>
                <p class="text-muted fs-15">The <b>{{ page_title }}</b> page is currently under development.</p>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-2">
                    <i class="mdi mdi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
