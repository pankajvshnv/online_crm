{% extends 'base.html' %}

{% block content %}
<div class="row"><div class="col-12"><div class="page-title-box d-sm-flex align-items-center justify-content-between"><h4 class="mb-sm-0">Add Payment</h4><div class="page-title-right"><ol class="breadcrumb m-0"><li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li><li class="breadcrumb-item">Payments</li><li class="breadcrumb-item active">Add Payment</li></ol></div></div></div></div>

<!-- Form Section -->
<div class="card">
    <div class="card-header"><h5 class="card-title">Payment Entry</h5></div>
    <div class="card-body">
        <form><div class="row g-4">
            <div class="col-md-6"><label class="form-label">Client</label><select class="form-select" name="client" required><option value="">Select Client</option><option>Vertex Realty</option><option>Bluefin Labs</option><option>Northstar Foods</option></select></div>
            <div class="col-md-6"><label class="form-label">Invoice</label><select class="form-select" name="invoice" required><option value="">Select Invoice</option><option>INV-2101</option><option>INV-2102</option><option>INV-2103</option></select></div>
            <div class="col-md-4"><label class="form-label">Amount</label><input type="number" class="form-control" name="amount" required min="1" placeholder="Enter amount"></div>
            <div class="col-md-4"><label class="form-label">Payment Date</label><input type="date" class="form-control" name="payment_date" required></div>
            <div class="col-md-4"><label class="form-label">Payment Mode</label><select class="form-select" name="mode" required><option value="">Select Mode</option><option value="bank">Bank Transfer</option><option value="upi">UPI</option><option value="cheque">Cheque</option><option value="cash">Cash</option></select></div>
            <div class="col-md-6"><label class="form-label">Transaction Reference</label><input type="text" class="form-control" name="reference" minlength="3" maxlength="80" placeholder="UTR / Cheque No"></div>
            <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status" required><option value="">Select Status</option><option value="received">Received</option><option value="pending">Pending</option><option value="failed">Failed</option></select></div>
            <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3" maxlength="300"></textarea></div>
            <div class="col-12"><!-- Action Buttons --><button type="submit" class="btn btn-primary">Save Payment</button><button type="reset" class="btn btn-light ms-2">Reset</button></div>
        </div></form>
    </div>
</div>
{% endblock %}
