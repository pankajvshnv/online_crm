{% extends 'base.html' %}

{% block content %}
<div class="row"><div class="col-12"><div class="page-title-box d-sm-flex align-items-center justify-content-between"><h4 class="mb-sm-0">Permission Matrix</h4><div class="page-title-right"><ol class="breadcrumb m-0"><li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li><li class="breadcrumb-item">Users</li><li class="breadcrumb-item active">Permission Matrix</li></ol></div></div></div></div>

<!-- Table Section -->
<div class="card">
    <div class="card-header"><h5 class="card-title">Module Permissions</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
                <thead class="table-light"><tr><th>Module</th><th>View</th><th>Create</th><th>Edit</th><th>Delete</th><th>Export</th></tr></thead>
                <tbody>
                    <tr><td>Leads</td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input"></td><td><input type="checkbox" class="form-check-input" checked></td></tr>
                    <tr><td>Clients</td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input"></td><td><input type="checkbox" class="form-check-input"></td></tr>
                    <tr><td>Payments</td><td><input type="checkbox" class="form-check-input" checked></td><td><input type="checkbox" class="form-check-input"></td><td><input type="checkbox" class="form-check-input"></td><td><input type="checkbox" class="form-check-input"></td><td><input type="checkbox" class="form-check-input"></td></tr>
                </tbody>
            </table>
        </div>
        <!-- Action Buttons -->
        <button type="button" class="btn btn-primary mt-4">Save Permissions</button>
    </div>
</div>
{% endblock %}
