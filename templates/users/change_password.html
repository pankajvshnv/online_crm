{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" style="margin-bottom: 65px;">

    <!-- Page Title & Breadcrumbs -->
    <div class="row">
        <div class="col-12">
            <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                <h4 class="mb-sm-0">Change Password</h4>
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="{{ url_for('user_profile') }}">Profile</a></li>
                        <li class="breadcrumb-item active">Change Password</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Form Card -->
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-light-subtle py-3 border-bottom d-flex align-items-center">
                    <div class="avatar avatar-sm avatar-label-warning me-2">
                        <i class="mdi mdi-lock-outline fs-18"></i>
                    </div>
                    <div>
                        <h5 class="card-title mb-0 fw-bold">Update Account Password</h5>
                        <small class="text-muted">Enter your new password below</small>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('change_password_page') }}" id="changePasswordForm">
                        
                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="newPassword">
                                New Password <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="mdi mdi-lock-reset text-muted"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="newPassword" name="new_password" placeholder="Enter new password (min 4 characters)" minlength="4" required autofocus>
                                <button type="button" class="btn btn-outline-secondary toggle-pwd-btn" data-target="newPassword" tabindex="-1" title="Show / Hide Password">
                                    <i class="mdi mdi-eye-outline"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="confirmPassword">
                                Confirm New Password <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="mdi mdi-lock-check-outline text-muted"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="confirmPassword" name="confirm_password" placeholder="Re-type new password" minlength="4" required>
                                <button type="button" class="btn btn-outline-secondary toggle-pwd-btn" data-target="confirmPassword" tabindex="-1" title="Show / Hide Password">
                                    <i class="mdi mdi-eye-outline"></i>
                                </button>
                            </div>
                            <div id="passwordMismatchFeedback" class="text-danger fs-12 mt-1 d-none">
                                <i class="mdi mdi-alert-circle-outline me-1"></i>Passwords do not match.
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex align-items-center justify-content-end gap-2 border-top pt-3">
                            <a href="{{ url_for('user_profile') }}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold" id="btnSubmitChangePassword">
                                <i class="mdi mdi-content-save-outline me-1"></i> Update Password
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    // Show/Hide Password toggles
    document.querySelectorAll(".toggle-pwd-btn").forEach(btn => {
        btn.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target");
            const input = document.getElementById(targetId);
            if (!input) return;

            const icon = this.querySelector("i");
            if (input.type === "password") {
                input.type = "text";
                if (icon) {
                    icon.classList.remove("mdi-eye-outline");
                    icon.classList.add("mdi-eye-off-outline");
                }
            } else {
                input.type = "password";
                if (icon) {
                    icon.classList.remove("mdi-eye-off-outline");
                    icon.classList.add("mdi-eye-outline");
                }
            }
        });
    });

    // Real-time Match Validation
    const newPwdInput = document.getElementById("newPassword");
    const confirmPwdInput = document.getElementById("confirmPassword");
    const mismatchMsg = document.getElementById("passwordMismatchFeedback");
    const submitBtn = document.getElementById("btnSubmitChangePassword");

    function validateMatch() {
        if (confirmPwdInput.value && newPwdInput.value !== confirmPwdInput.value) {
            mismatchMsg.classList.remove("d-none");
            submitBtn.disabled = true;
        } else {
            mismatchMsg.classList.add("d-none");
            submitBtn.disabled = false;
        }
    }

    if (newPwdInput && confirmPwdInput) {
        newPwdInput.addEventListener("input", validateMatch);
        confirmPwdInput.addEventListener("input", validateMatch);
    }
});
</script>
{% endblock %}
