{% extends 'base.html' %}

{% block content %}
<div class="row"><div class="col-12"><div class="page-title-box d-sm-flex align-items-center justify-content-between"><h4 class="mb-sm-0">Lead Status</h4><div class="page-title-right"><ol class="breadcrumb m-0"><li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li><li class="breadcrumb-item">Leads</li><li class="breadcrumb-item active">Lead Status</li></ol></div></div></div></div>

<!-- Form Section -->
<div class="card"><div class="card-header"><h5 class="card-title">Add Status</h5></div><div class="card-body"><form><div class="row g-3"><div class="col-md-4"><label class="form-label">Status Name</label><input type="text" class="form-control" name="status_name" required minlength="2" maxlength="60" placeholder="Qualified"></div><div class="col-md-4"><label class="form-label">Color</label><select class="form-select" name="color" required><option value="">Select Color</option><option>Primary</option><option>Success</option><option>Warning</option><option>Danger</option></select></div><div class="col-md-4 d-flex align-items-end"><button type="submit" class="btn btn-primary">Save Status</button></div></div></form></div></div>

<!-- Table Section -->
<div class="card"><div class="card-header"><h5 class="card-title">Status Summary</h5></div><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>S.No</th><th>Status</th><th>Total Leads</th><th>Color</th><th>Action</th></tr></thead><tbody><tr><td>1</td><td>New</td><td>48</td><td><span class="badge bg-info-subtle text-info">Info</span></td><td><!-- Action Buttons --><button class="btn btn-sm btn-primary">Edit</button></td></tr><tr><td>2</td><td>Qualified</td><td>58</td><td><span class="badge bg-success-subtle text-success">Success</span></td><td><!-- Action Buttons --><button class="btn btn-sm btn-primary">Edit</button></td></tr></tbody></table></div></div></div>
{% endblock %}
