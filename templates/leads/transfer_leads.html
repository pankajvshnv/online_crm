{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
            <h4 class="mb-sm-0">Transfer Leads</h4>
            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="breadcrumb-item">Leads</li>
                    <li class="breadcrumb-item active">Transfer Leads</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<!-- Form Section -->
<div class="card">
    <div class="card-header"><h5 class="card-title">Transfer Ownership</h5></div>
    <div class="card-body">
        <form>
            <div class="row g-4">
                <div class="col-md-4">
                    <label class="form-label">Current Owner</label>
                    <select class="form-select" name="current_owner" required>
                        <option value="">Select Current Owner</option>
                        <option value="priya">Priya Sharma</option>
                        <option value="rohan">Rohan Iyer</option>
                        <option value="neha">Neha Joshi</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">New Owner</label>
                    <select class="form-select" name="new_owner" required>
                        <option value="">Select New Owner</option>
                        <option value="priya">Priya Sharma</option>
                        <option value="rohan">Rohan Iyer</option>
                        <option value="neha">Neha Joshi</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Lead Status</label>
                    <select class="form-select" name="lead_status">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="qualified">Qualified</option>
                        <option value="proposal">Proposal</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Reason</label>
                    <textarea class="form-control" name="reason" rows="3" placeholder="Reason for transfer" maxlength="300"></textarea>
                </div>
                <div class="col-12">
                    <!-- Action Buttons -->
                    <button type="button" class="btn btn-primary">Transfer Leads</button>
                    <button type="reset" class="btn btn-light ms-2">Reset</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Table Section -->
<div class="card">
    <div class="card-header"><h5 class="card-title">Transfer Preview</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>S.No</th>
                        <th>Lead Name</th>
                        <th>Company</th>
                        <th>Current Owner</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>Aarav Mehta</td><td>Vertex Realty</td><td>Priya Sharma</td><td>Qualified</td></tr>
                    <tr><td>2</td><td>Mira Nair</td><td>Urban Nest</td><td>Priya Sharma</td><td>Proposal</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
