<div class="modal fade" id="createdDateModal" tabindex="-1" aria-labelledby="createdDateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createdDateModalLabel">Created Date Range</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="createdDateFrom">From Date</label>
                        <input type="date" class="form-control bg-white" id="createdDateFrom" value="{{ request.args.get('created_from', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="createdDateTo">To Date</label>
                        <input type="date" class="form-control bg-white" id="createdDateTo" value="{{ request.args.get('created_to', '') }}">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" onclick="clearDateFilter('created')">Clear</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="applyDateFilter()">Apply Filter</button>
            </div>
        </div>
    </div>
</div>
