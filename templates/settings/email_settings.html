{% extends 'base.html' %}

{% block content %}
<div class="row"><div class="col-12"><div class="page-title-box d-sm-flex align-items-center justify-content-between"><h4 class="mb-sm-0">Email Settings</h4><div class="page-title-right"><ol class="breadcrumb m-0"><li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li><li class="breadcrumb-item">Settings</li><li class="breadcrumb-item active">Email Settings</li></ol></div></div></div></div>
<!-- Form Section -->
<div class="card"><div class="card-header"><h5 class="card-title">SMTP Configuration</h5></div><div class="card-body"><form><div class="row g-4"><div class="col-md-6"><label class="form-label">SMTP Host</label><input type="text" class="form-control" name="smtp_host" required minlength="3" maxlength="120"></div><div class="col-md-6"><label class="form-label">SMTP Port</label><input type="number" class="form-control" name="smtp_port" required min="1" max="65535"></div><div class="col-md-6"><label class="form-label">Username</label><input type="email" class="form-control" name="username" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Sender Email</label><input type="email" class="form-control" name="sender_email" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Encryption</label><select class="form-select" name="encryption" required><option value="">Select Encryption</option><option>TLS</option><option>SSL</option><option>None</option></select></div><div class="col-12"><!-- Action Buttons --><button class="btn btn-primary" type="submit">Save Email Settings</button></div></div></form></div></div>
{% endblock %}
