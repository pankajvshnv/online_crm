{% extends 'base.html' %}

{% block content %}
<div class="row"><div class="col-12"><div class="page-title-box d-sm-flex align-items-center justify-content-between"><h4 class="mb-sm-0">WhatsApp Settings</h4><div class="page-title-right"><ol class="breadcrumb m-0"><li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li><li class="breadcrumb-item">Settings</li><li class="breadcrumb-item active">WhatsApp Settings</li></ol></div></div></div></div>
<!-- Form Section -->
<div class="card"><div class="card-header"><h5 class="card-title">WhatsApp Integration</h5></div><div class="card-body"><form><div class="row g-4"><div class="col-md-6"><label class="form-label">Provider</label><select class="form-select" name="provider" required><option value="">Select Provider</option><option>Meta Cloud API</option><option>Twilio</option><option>Gupshup</option></select></div><div class="col-md-6"><label class="form-label">Business Number</label><input type="tel" class="form-control" name="business_number" required minlength="10" maxlength="15"></div><div class="col-md-6"><label class="form-label">API Key</label><input type="text" class="form-control" name="api_key" required minlength="8" maxlength="160"></div><div class="col-md-6"><label class="form-label">Webhook URL</label><input type="url" class="form-control" name="webhook_url" maxlength="160"></div><div class="col-12"><!-- Action Buttons --><button class="btn btn-primary" type="submit">Save WhatsApp Settings</button></div></div></form></div></div>
{% endblock %}
